<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Khách hàng</title>
    <!-- Link Bootstrap -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f4f4;
        }

        .auth-container {
            max-width: 450px;
            margin: 50px auto;
        }

        .card {
            border: 2px solid #3b2416; 
            border-radius: 10px;
        }

        h3 {
            color: #3b2416; 
        }

        .nav-pills .nav-link {
            color: #3b2416;
            font-weight: bold;
        }

        .nav-pills .nav-link.active {
            background-color: #c6893f !important; 
            color: white !important;
        }

       
        .btn-caffe {
            background-color: #c6893f;
            color: white;
            font-weight: bold;
            border: none;
            padding: 10px;
        }

        .btn-caffe:hover, .btn-caffe:focus {
            background-color: #c6893f; 
            color: white;
            box-shadow: none;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="card p-4 shadow-sm">
            <h3 class="text-center mb-4">Đăng Ký Tài Khoản</h3>

            <ul class="nav nav-pills nav-fill mb-4">
                <li class="nav-item">
                    <a class="nav-link" href="Dangnhapuser.html">Đăng nhập</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="Dangkyuser.html">Đăng ký</a>
                </li>
            </ul>

            <form id="f-user-register">
                <div class="mb-3">
                    <label class="form-label text-dark fw-bold">Tên hiển thị</label>
                    <input type="text" name="uname" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-dark fw-bold">Số điện thoại</label>
                    <!-- Ép nhập đúng 10 số từ 0-9 -->
                    <input type="tel" name="phone" class="form-control" placeholder="Nhập 10 số điện thoại" pattern="[0-9]{10}" maxlength="10" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-dark fw-bold">Mật khẩu</label>
                    <input type="password" name="pass" class="form-control" placeholder="Tạo mật khẩu" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-dark fw-bold">Nhập lại Mật khẩu</label>
                    <input type="password" name="repass" class="form-control" placeholder="Xác nhận mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-caffe w-100 mt-2">Đăng ký</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('f-user-register').addEventListener('submit', function (e) {
            e.preventDefault();

            let uname = this.uname.value.trim();
            let phone = this.phone.value.trim();
            let pass = this.pass.value.trim();
            let repass = this.repass.value.trim();

            // Kiểm tra rỗng
            if (phone === '' || pass === '' || repass === '' || uname === '') {
                alert('Vui lòng không bỏ trống bất kỳ thông tin nào!');
                return;
            }

            // Kiểm tra định dạng số điện thoại (đúng 10 số)
            let phoneRegex = /^[0-9]{10}$/;
            if (!phoneRegex.test(phone)) {
                alert('Số điện thoại phải bao gồm đúng 10 chữ số (từ 0-9)!');
                return;
            }

            if (pass !== repass) {
                alert('Mật khẩu nhập lại không khớp. Vui lòng kiểm tra lại!');
                return;
            }
           
            let userList = JSON.parse(localStorage.getItem('usersDB')) || [];
            
            let isExist = userList.some(user => user.phone === phone);
            if (isExist) {
                alert('Số điện thoại này đã được đăng ký!');
                return;
            }
           
            userList.push({ name: uname, phone: phone, password: pass });
            localStorage.setItem('usersDB', JSON.stringify(userList));

            alert('Đăng ký thành công! Chuyển về màn hình đăng nhập.');
            window.location.href = 'Dangnhapuser.html';
        });
    </script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>

</html>
